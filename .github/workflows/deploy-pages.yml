name: Publicar demonstração HB Materiais

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Implantar site
        id: deployment
        uses: actions/deploy-pages@v4
